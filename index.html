<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Router Command Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-color: #f1f5f9; /* Light Slate */
            --card-bg: #ffffff;
            --text-main: #0f172a; /* Dark Slate */
            --text-muted: #64748b;
            --primary: #f97316; /* Warm Orange */
            --primary-hover: #ea580c;
            --border-color: #e2e8f0;
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
            --terminal-bg: #0f172a;
            --terminal-header: #1e293b;
            --terminal-text: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .error-box {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 16px 20px;
            border-radius: 6px;
            border: 1px solid #fecaca;
            border-left: 4px solid var(--error-text);
            margin-top: 25px;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .error-box::before {
            content: '⚠';
            font-size: 1.2rem;
        }

        .results-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .result-box {
            background: var(--terminal-bg);
            border-radius: 8px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Standard window header */
        .term-header {
            background: var(--terminal-header);
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .term-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .term-dot.red { background: #ef4444; }
        .term-dot.yellow { background: #f59e0b; }
        .term-dot.green { background: #10b981; }

        .result-box h3 {
            margin: 0;
            padding: 14px 20px;
            color: #f8fafc;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            background: #0b1120;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-box h3::before {
            content: '>';
            color: var(--primary);
            font-weight: 700;
        }

        pre {
            margin: 0;
            padding: 20px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--terminal-text);
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Automation Dashboard</h1>
        
        <form method="POST">
            <button type="submit" class="btn">Connect & Run Commands</button>
        </form>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        {% if results %}
            <div class="results-container">
                {% for cmd, output in results.items() %}
                    <div class="result-box">
                        <div class="term-header">
                            <div class="term-dot red"></div>
                            <div class="term-dot yellow"></div>
                            <div class="term-dot green"></div>
                        </div>
                        <h3>{{ cmd }}</h3>
                        <pre>{{ output }}</pre>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
