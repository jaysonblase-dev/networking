<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Router Command Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-base: #050505;
            --primary-color: #00ffcc; /* Neon Cyan */
            --primary-hover: #00b38f;
            --text-main: #e0e0e0;
            --error-bg: rgba(255, 0, 60, 0.1);
            --error-text: #ff003c;
            --terminal-bg: #0a0a0a;
            --terminal-text: #00ffcc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-base);
            /* Cyberpunk background grid and glow */
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(0, 255, 204, 0.15), transparent 60%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            color: var(--text-main);
            margin: 0;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 4px; /* Sharp corners for cyberpunk feel */
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1), 
                        inset 0 0 20px rgba(0, 255, 204, 0.05);
            position: relative;
        }

        /* Decorative corner brackets */
        .container::before, .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-color);
        }
        .container::before {
            top: -1px; left: -1px;
            border-right: none; border-bottom: none;
        }
        .container::after {
            bottom: -1px; right: -1px;
            border-left: none; border-top: none;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            border-bottom: 2px solid rgba(0, 255, 204, 0.3);
            padding-bottom: 15px;
            display: inline-block;
            font-family: 'Share Tech Mono', monospace;
        }

        .btn {
            background: transparent;
            color: var(--primary-color);
            padding: 15px 30px;
            border: 2px solid var(--primary-color);
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.3), transparent);
            transition: all 0.4s ease;
        }

        .btn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            text-shadow: 0 0 5px var(--primary-color);
        }

        .btn:hover::before {
            left: 100%;
        }

        .error-box {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 20px;
            border: 1px solid var(--error-text);
            border-left: 4px solid var(--error-text);
            margin-top: 30px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.2);
        }

        .error-box::before {
            content: '[ERR]';
            font-weight: bold;
            letter-spacing: 1px;
        }

        .results-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .result-box {
            background: var(--terminal-bg);
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Fake Mac/Linux Terminal Header */
        .term-header {
            background: #151515;
            padding: 10px 15px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .term-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .term-dot.red { background: #ff5f56; }
        .term-dot.yellow { background: #ffbd2e; }
        .term-dot.green { background: #27c93f; }

        .result-box h3 {
            margin: 0;
            padding: 12px 20px;
            color: var(--primary-color);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
        }

        .result-box h3::before {
            content: '> root@router:~#';
            margin-right: 15px;
            color: #666;
            font-size: 0.9rem;
        }

        pre {
            margin: 0;
            padding: 20px;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.6;
            color: var(--terminal-text);
            white-space: pre-wrap;
            word-wrap: break-word;
            text-shadow: 0 0 3px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Network Automation Dashboard</h1>
        
        <form method="POST">
            <button type="submit" class="btn">Connect & Run Commands</button>
        </form>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% endif %}

        {% if results %}
            <div class="results-container">
                {% for cmd, output in results.items() %}
                    <div class="result-box">
                        <div class="term-header">
                            <div class="term-dot red"></div>
                            <div class="term-dot yellow"></div>
                            <div class="term-dot green"></div>
                        </div>
                        <h3>{{ cmd }}</h3>
                        <pre>{{ output }}</pre>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
